$schema: "https://moonrepo.dev/schemas/workspace.json"

# Only packages with native addons are modelled; the rest are built by
# `pnpm build` (vite-plus) as before.
projects:
  chords-menu: "@keychord/chords-menu"
  chords-web: "@keychord/chords-web"
  chords-com.apple: "@keychord/chords-com.apple"
  chords-dock: "@keychord/chords-dock"
  chords-windows: "@keychord/chords-windows"
  chords-monitors: "@keychord/chords-monitors"

vcs:
  defaultBranch: main
