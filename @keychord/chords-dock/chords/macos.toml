name = "macOS Dock + Window Management"

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[on.dock]
file = 'dock.js'

[chords]
# Built-in macOS window management shortcuts
# Can be overriden if using a dedicated window manager such as yabai, Aerospace, etc.
'?/w' = { name = "Dock / Window Management" }

# Move and Resize
'/wl' = { name = "Window: (Move) Left", shortcut = "ctrl+fn+left" }
'/wr' = { name = "Window: (Move) Right", shortcut = "ctrl+fn+right" }
'/wt' = { name = "Window: (Move) Top", shortcut = "ctrl+fn+up" }
'/wb' = { name = "Window: (Move) Bottom", shortcut = "ctrl+fn+down" }
'/wtl' = { name = "Window: (Move) Top Left", '@input:menu' = [
  "Window",
  "Move & Resize",
  "Top Left",
] }
'/wtr' = { name = "Window: (Move) Top Right", '@input:menu' = [
  "Window",
  "Move & Resize",
  "Top Right",
] }
'/wbl' = { name = "Window: (Move) Bottom Left", '@input:menu' = [
  "Window",
  "Move & Resize",
  "Bottom Left",
] }
'/wbr' = { name = "Window: (Move) Bottom Right", '@input:menu' = [
  "Window",
  "Move & Resize",
  "Bottom Right",
] }
'/wlr' = { name = "Window: (Move) Left Right", shortcut = "ctrl+fn+shift+left" }
'/wrl' = { name = "Window: (Move) Right Left", shortcut = "ctrl+fn+shift+right" }
'/wtb' = { name = "Window: (Move) Top Bottom", shortcut = "ctrl+fn+shift+up" }
'/wbt' = { name = "Window: (Move) Bottom Top", shortcut = "ctrl+fn+shift+down" }
'/wq' = { name = "Window: (Move) Quarters", '@input:menu' = [
  "Window",
  "Move & Resize",
  "Quarters",
] }

'/ws[' = { name = "Window: Size Previous", shortcut = "ctrl+fn+r" }
'/wz' = { name = "Window: Zoom", '@input:menu' = ["Window", 'Zoom'] }

'/h' = { name = "Hide", shortcut = "cmd+h" }
'/m' = { name = "Minimize", shortcut = "cmd+m" }
'/q' = { name = "Quit", shortcut = "cmd+q" }

'/wf' = { name = "Window: Fill", shortcut = "ctrl+fn+f" }
'/wc' = { name = "Window: Center", shortcut = "ctrl+fn+c" }
'/wfl' = { name = "Window: Fullscreen Left", '@input:menu' = [
  "Window",
  "Full Screen Tile",
  "Left of Screen",
] }
'/wfr' = { name = "Window: Fullscreen Right", '@input:menu' = [
  "Window",
  "Full Screen Tile",
  "Right of Screen",
] }
'/waf' = { name = "Window: All to Front", '@input:menu' = ["Window", "Bring All to Front"] }
'/w[' = { name = "Window: Previous " }
'/w]' = { name = "Window: Window" }

# Dock
'/dv' = { name = "Dock: Vary (On/Off)", shortcut = "ctrl+f3" }
'/d(\d+)' = { name = "Dock > Focus $1", '@input:dock' = ['$1'] }
'/d.(\d+).' = { name = "Dock > Click @ Item $1", '@input:dock' = ['$1'] }
'/d.,(\d+)' = { name = "Dock > Right Click @ Item $1", '@input:dock' = ['$1', 'right'] }
