name = "macOS Dock + Window Management"

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[on.dock]
file = 'dock.js'

[chords]
# Built-in macOS window management shortcuts
# Can be overriden if using a dedicated window manager such as yabai, Aerospace, etc.
'?.' = { name = "Dock / Window Management" }

# Move and Resize
'.ml' = { name = "Move: Left", shortcut = "ctrl+fn+left" }
'.mr' = { name = "Move: Right", shortcut = "ctrl+fn+right" }
'.mt' = { name = "Move: Top", shortcut = "ctrl+fn+up" }
'.mb' = { name = "Move: Bottom", shortcut = "ctrl+fn+down" }
'.mtl' = { name = "Move: Top Left", '@input:menu' = ["Window", "Move & Resize", "Top Left"] }
'.mtr' = { name = "Move: Top Right", '@input:menu' = ["Window", "Move & Resize", "Top Right"] }
'.mbl' = { name = "Move: Bottom Left", '@input:menu' = ["Window", "Move & Resize", "Bottom Left"] }
'.mbr' = { name = "Move: Bottom Right", '@input:menu' = [
  "Window",
  "Move & Resize",
  "Bottom Right",
] }
'.mlr' = { name = "Move: Left Right", shortcut = "ctrl+fn+shift+left" }
'.mrl' = { name = "Move: Right Left", shortcut = "ctrl+fn+shift+right" }
'.mtb' = { name = "Move: Top Bottom", shortcut = "ctrl+fn+shift+up" }
'.mbt' = { name = "Move: Bottom Top", shortcut = "ctrl+fn+shift+down" }
'.mq' = { name = "Move: Quarters", '@input:menu' = ["Window", "Move & Resize", "Quarters"] }

'.s[' = { name = "Size: Previous", shortcut = "ctrl+fn+r" }

'.m' = { name = "Minimize", shortcut = "cmd+m" }
'.q' = { name = "Quit", shortcut = "cmd+q" }
'.z' = { name = "Zoom", '@input:menu' = ["Window", 'Zoom'] }
'.f' = { name = "Fill", shortcut = "ctrl+fn+f" }
'.c' = { name = "Center", shortcut = "ctrl+fn+c" }
'.fl' = { name = "Fullscreen Left", '@input:menu' = [
  "Window",
  "Full Screen Tile",
  "Left of Screen",
] }
'.fr' = { name = "Fullscreen Right", '@input:menu' = [
  "Window",
  "Full Screen Tile",
  "Right of Screen",
] }
'.a' = { name = "All to Front", '@input:menu' = ["Window", "Bring All to Front"] }
'.[' = { name = "Previous Window" }
'.]' = { name = "Next Window" }

# Dock
'.v' = { name = "Dock: Vary On/Off", shortcut = "ctrl+f3" }
'.(\d+)' = { name = "Dock Item $1: Focus", '@input:dock' = ['$1'] }
'.(\d+),' = { name = "Dock Item $1: Left Click", '@input:dock' = ['$1'] }
'.(\d+)/' = { name = "Dock Item $1: Right Click", '@input:dock' = ['$1', 'right'] }
