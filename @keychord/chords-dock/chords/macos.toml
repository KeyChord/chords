name = 'macOS Dock'

[meta]
chord = '>=0.3.0'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[on.dock]
file = 'dock.js'

[on.application]
file = 'application.js'

# Every chord starts with `<>`, which Chord replaces with the prefix chosen in Settings → Chords
# → Placeholders or inherits the global symbol before its letter.
[placeholders]
"<>" = { name = 'Dock prefix', default = 'd' }

[chords]
'?<>' = { name = "Dock" }
'<>w[' = { name = 'Dock: Previous App', '@input:application' = ['PREVIOUS'] }
'<>w]' = { name = 'Dock: Next App', '@input:application' = ['NEXT'] }
'<>v' = { name = 'Dock: Vary (On/Off)', shortcut = 'ctrl+f3' }
'<>(\d+)' = { name = 'Dock > Focus $1', '@input:dock' = ['$1'] }
'<>.(\d+).' = { name = 'Dock > Click @ Item $1', '@input:dock' = ['$1', 'LEFT'] }
'<>.,(\d+)' = { name = 'Dock > Right Click @ Item $1', '@input:dock' = ['$1', 'RIGHT'] }
