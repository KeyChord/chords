name = 'Raycast'

# `fallback` needs Chord 0.2.5; older versions would let this launcher take over every `/` chord.
[meta]
version = '>=0.2.5'

[on.raycast]
file = 'raycast.js'

[chords]
# The `/` launcher. As a fallback it runs only when no other chord matches, so `/f` still opens
# Finder. Installed packages override built-in ones, so it replaces the Spotlight launcher.
'/(.*)' = { name = 'Raycast: Search $1', fallback = true, '@input:raycast' = ['$1'] }
