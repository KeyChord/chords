name = 'TV'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[chords]
'?a' = { name = 'App' }
'a,' = { name = 'App: Settings', '@input:menu' = ['BY_PATH', ['TV', 'Settings…']] }
'?g' = { name = 'Goto' }
'g/' = { name = 'Goto: Search', shortcut = 'cmd+f' }
'?n' = { name = 'New' }
'np' = { name = 'New: Playlist', '@input:menu' = ['BY_PATH', ['File', 'New', 'Playlist']] }
'ns' = { name = 'New: Smart Playlist', '@input:menu' = [
  'BY_PATH',
  [
    'File',
    'New',
    'Smart Playlist',
  ],
] }
'?f' = { name = 'File' }
'fi' = { name = 'File: Import', '@input:menu' = ['BY_PATH', ['File', 'Import…']] }
'ff' = { name = 'File: Show in Finder', '@input:menu' = ['BY_PATH', ['File', 'Show in Finder']] }
'?v' = { name = 'View' }
'va' = { name = 'View: Activity', '@input:menu' = ['BY_PATH', ['Window', 'Activity']] }
'vo' = { name = 'View: View Options', '@input:menu' = ['SEARCH', 'View Options'] }
'vb' = { name = 'View: Status Bar', '@input:menu' = ['SEARCH', 'Status Bar'] }
'?i' = { name = 'Item' }
'ii' = { name = 'Item: Get Info', '@input:menu' = ['BY_PATH', ['Actions', 'Get Info…']] }
'?p' = { name = 'Playback' }
'pp' = { name = 'Playback: Play', '@input:menu' = ['BY_PATH', ['Controls', 'Play']] }
'ph' = { name = 'Playback: Pause', '@input:menu' = ['BY_PATH', ['Controls', 'Pause']] }
