name = 'macOS Menu Bar'

[on.menu]
file = 'menu.js'
args = []

[on.tray]
file = 'tray.js'

[on.select]
file = 'selection.js'

[on.visibility]
file = 'visibility.js'

[chords]
'?=' = { name = 'Menu/Tray' }

'?=[' = { name = 'Menu Bar: Menus By Index' }
'?=/' = { name = 'Menu Bar: Search' }
'=[([a-z]+(?:-[a-z]+)*[0-9]*).' = { name = 'Menu Bar: by letter', '@input:menu' = [
  'BY_LETTERS',
  '$1',
] }

'=/(.+)' = { name = 'Menu Bar: Search $1', '@input:menu' = ['SEARCH', '$1'] }


'?=0' = { name = 'Menu Bar: Apple Logo' }
'?="1-9"' = { name = 'Tray: Select Icon' }
'?=-' = { name = 'Menu Bar: Notch / Tray From Right' }
'?=-"1-9"' = { name = 'Tray: Select From Right' }

'?=]' = { name = 'Menu Bar: Tray Icons' }

# Bare indexes select tray icons; [ selects menus; ] is an explicit tray alias.
# Bare 0 selects Apple. Bracket steps stay in the selected group.
# The last digit wins unless l/r follows the full number. [ and ] step; . clicks; , right-clicks.
'=([\[\]]?-?(?:0|[1-9][0-9]*)[lr]?[\[\]]*[.,]?)' = { name = 'Menu Bar: Select / Click Item', '@keydown:select' = [
  'KEYDOWN',
  '$1',
], '@input:select' = [
  'INPUT',
  '$1',
] }

# Completing the bare minus clicks the notch; typing a negative index only previews that item.
'=-' = { name = 'Menu Bar: Click Notch', '@input:tray' = ['NOTCH'] }

'=p' = { name = 'Tray: Power / Battery', '@input:tray' = ['BATTERY'] }

# Control Center
'=c' = { name = 'Tray: Control Center', '@input:tray' = ['CONTROL_CENTER'] }
'=cd' = { name = 'Tray: Control Center > Display', '@input:tray' = ['CONTROL_CENTER', 'DISPLAY'] }
'=cd-' = { name = 'Tray: Control Center > Display > Decrease', '@input:tray' = [
