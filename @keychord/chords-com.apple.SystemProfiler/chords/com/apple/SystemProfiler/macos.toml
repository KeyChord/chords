name = 'System Information'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[chords]
'?r' = { name = 'Report' }
'rn' = { name = 'Report: Show System Report', '@input:menu' = [
  'BY_PATH',
  [
    'File',
    'Show System Report',
  ],
] }
'ro' = { name = 'Report: Open', '@input:menu' = ['BY_PATH', ['File', 'Open…']] }
'rs' = { name = 'Report: Save', '@input:menu' = ['BY_PATH', ['File', 'Save…']] }
'rp' = { name = 'Report: Print', '@input:menu' = ['BY_PATH', ['File', 'Print…']] }
'rl' = { name = 'Report: Show Less Information', '@input:menu' = [
  'BY_PATH',
  [
    'File',
    'Show Less Information',
  ],
] }
'rm' = { name = 'Report: Show More Information', '@input:menu' = [
  'BY_PATH',
  [
    'File',
    'Show More Information',
  ],
] }

'?f' = { name = 'Find' }
'ff' = { name = 'Find: Find in Report', '@input:menu' = ['BY_PATH', ['Edit', 'Find', 'Find…']] }
