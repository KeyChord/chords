name = 'VSCode'

[on.command]
file = 'vscode.js'
args = ['/Applications/Visual Studio Code.app']

[chords]
'?f' = { name = 'Find / File' }

# Find
'f[' = [
  { name = 'Find Previous', '@input:command' = [
    'workbench.action.browser.findPrevious',
  ], shortcut = 'shift+cmd+g' },
  { name = 'workbench.action.terminal.findPrevious', '@input:command' = [
    'workbench.action.terminal.findPrevious',
  ], shortcut = 'shift+f3' },
]
'f]' = [
  { name = 'Find Next', '@input:command' = [
    'workbench.action.browser.findNext',
  ], shortcut = 'cmd+g' },
  { name = 'workbench.action.terminal.findNext', '@input:command' = [
    'workbench.action.terminal.findNext',
  ], shortcut = 'f3' },
]
fr = { name = 'Find and Replace', '@input:command' = [
  'editor.action.startFindReplaceAction',
], shortcut = 'alt+cmd+f' }
fg = { name = 'Find Globally', '@input:command' = [
  'workbench.action.findInFiles',
], shortcut = 'shift+cmd+f' }
frg = { name = 'Find Replace Globally', '@input:command' = [
  'workbench.action.replaceInFiles',
], shortcut = 'shift+cmd+h' }

# File
fpa = { name = 'File Path: Absolute (copy to clipboard)', '@input:command' = ['copyFilePath'] }
fpr = { name = 'File: Path: Relative (copy to clipboard)', '@input:command' = [
  'workbench.action.files.copyPathOfActiveFile',
] }
frp = { name = 'File: Relative Path', '@input:command' = [
  'copyRelativeFilePath',
], shortcut = 'shift+alt+cmd+c' }
fn = { name = 'File: New', shortcut = 'ctrl+opt+cmd+n' }
fnn = { name = 'File: New Name', '@input:command' = ['renameFile'] }
fh = { name = 'File: Here', '@input:command' = ['explorer.newFile'] }
fd = { name = 'File: Directory', '@input:command' = ['explorer.newFolder'] }
fc = { name = 'File: Close Directory', '@input:command' = [
  'workbench.action.closeFolder',
], shortcut = 'cmd+k f' }
fnu = { name = 'File: New Untitled File', '@input:command' = [
  'workbench.action.files.newUntitledFile',
], shortcut = 'cmd+n' }
ft = { name = 'File: Trash', '@input:command' = ['deleteFile'], shortcut = 'alt+cmd+backspace' }
fm = { name = 'File: Format', '@input:command' = [
  'editor.action.formatDocument',
], shortcut = 'shift+alt+f' }
fs = { name = 'File: Show', '@input:command' = ['revealInExplorer'] }
fra = { name = 'search.action.replaceAllInFile', '@input:command' = [
  'search.action.replaceAllInFile',
], shortcut = 'shift+cmd+enter' }
fo = { name = 'File: Open', '@input:command' = [
  'workbench.action.files.openFile',
], shortcut = 'cmd+o' }
for = { name = 'File: Open Recent', '@input:command' = [
  'workbench.action.openRecent',
], shortcut = 'ctrl+r' }

## Fold
'?ff' = { name = 'Folding: Fold' }
ff = { name = 'Folding: Fold', '@input:command' = ['editor.fold'], shortcut = 'alt+cmd+[' }
ffa = { name = 'Folding: Fold All', '@input:command' = [
  'editor.foldAll',
], shortcut = 'cmd+k cmd+0' }
ffc = { name = 'Folding: Fold Comments', '@input:command' = [
  'editor.foldAllBlockComments',
], shortcut = 'cmd+k cmd+/' }
ffr = { name = 'Folding: Fold Recursively', '@input:command' = [
  'editor.foldRecursively',
], shortcut = 'cmd+k cmd+[' }
ffe = { name = 'Folding: Fold All Except', '@input:command' = [
  'editor.foldAllExcept',
], shortcut = 'cmd+k cmd+-' }
ffm = { name = 'Folding: Fold All Marker Regions', '@input:command' = [
  'editor.foldAllMarkerRegions',
], shortcut = 'cmd+k cmd+8' }

## Unfold
'?fu' = { name = 'Folding: Unfold' }
fu = { name = 'Folding: Unfold', '@input:command' = ['editor.unfold'], shortcut = 'alt+cmd+]' }
fua = { name = 'Folding: Unfold All', '@input:command' = [
  'editor.unfoldAll',
], shortcut = 'cmd+k cmd+j' }
fuc = { name = 'Folding: Unfold Comments', '@input:command' = ['editor.unfoldAllBlockComments'] }
fur = { name = 'Folding: Unfold Recursively', '@input:command' = [
  'editor.unfoldRecursively',
], shortcut = 'cmd+k cmd+]' }
fue = { name = 'Folding: Unfold All Except', '@input:command' = [
  'editor.unfoldAllExcept',
], shortcut = 'cmd+k cmd+=' }
fum = { name = 'Folding: Unfold All Marker Regions', '@input:command' = [
  'editor.unfoldAllMarkerRegions',
], shortcut = 'cmd+k cmd+9' }

ffs = { name = 'Folding: From Selection', '@input:command' = [
  'editor.createFoldingRangeFromSelection',
], shortcut = 'cmd+k cmd+,' }
frm = { name = 'Folding: Remove Manual', '@input:command' = [
  'editor.removeManualFoldingRanges',
], shortcut = 'cmd+k cmd+.' }
ftr = { name = 'Folding: Toggle Recursively', '@input:command' = [
  'editor.toggleFoldRecursively',
], shortcut = 'cmd+k shift+cmd+l' }

'?f"1-7"' = { name = 'Folding: Level' }
f1 = { name = 'editor.foldLevel1', '@input:command' = [
  'editor.foldLevel1',
], shortcut = 'cmd+k cmd+1' }
f2 = { name = 'editor.foldLevel2', '@input:command' = [
  'editor.foldLevel2',
], shortcut = 'cmd+k cmd+2' }
f3 = { name = 'editor.foldLevel3', '@input:command' = [
  'editor.foldLevel3',
], shortcut = 'cmd+k cmd+3' }
f4 = { name = 'editor.foldLevel4', '@input:command' = [
  'editor.foldLevel4',
], shortcut = 'cmd+k cmd+4' }
f5 = { name = 'editor.foldLevel5', '@input:command' = [
  'editor.foldLevel5',
], shortcut = 'cmd+k cmd+5' }
f6 = { name = 'editor.foldLevel6', '@input:command' = [
  'editor.foldLevel6',
], shortcut = 'cmd+k cmd+6' }
f7 = { name = 'editor.foldLevel7', '@input:command' = [
  'editor.foldLevel7',
], shortcut = 'cmd+k cmd+7' }

# History
hb = { name = 'History: Back', '@input:command' = [
  'workbench.action.navigateBack',
], shortcut = 'BrowserBack' }
hf = { name = 'History: Forward', '@input:command' = [
  'workbench.action.navigateForward',
], shortcut = 'BrowserForward' }

