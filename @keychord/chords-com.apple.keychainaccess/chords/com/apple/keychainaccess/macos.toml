name = 'Keychain Access'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[chords]
'?f' = { name = 'File' }
'fp' = { name = 'File: New Password Item', '@input:menu' = [
  'BY_PATH',
  [
    'File',
    'New Password Item…',
  ],
] }
'fk' = { name = 'File: New Keychain', '@input:menu' = ['BY_PATH', ['File', 'New Keychain…']] }
'fa' = { name = 'File: Add Keychain', '@input:menu' = ['BY_PATH', ['File', 'Add Keychain...']] }
'fi' = { name = 'File: Import Items', '@input:menu' = ['BY_PATH', ['File', 'Import Items…']] }
'fe' = { name = 'File: Export Items', '@input:menu' = ['BY_PATH', ['File', 'Export Items…']] }

'?g' = { name = 'Goto' }
'gf' = { name = 'Goto: Find', '@input:menu' = ['BY_PATH', ['Edit', 'Find']] }
'gv' = { name = 'Goto: Keychain Viewer', '@input:menu' = [
  'BY_PATH',
  [
    'Window',
    'Keychain Viewer',
  ],
] }
'gt' = { name = 'Goto: Ticket Viewer', '@input:menu' = [
  'BY_PATH',
  [
    'Keychain Access',
    'Ticket Viewer',
  ],
] }
'gc' = { name = 'Goto: Settings', '@input:menu' = ['BY_PATH', ['Keychain Access', 'Preferences…']] }
'gi' = { name = 'Goto: Item Info', '@input:menu' = ['BY_PATH', ['File', 'Get Info']] }

'?v' = { name = 'Vary' }
'vs' = { name = 'Vary: Sidebar', '@input:menu' = ['SEARCH', 'Sidebar'] }
'vm' = { name = 'Vary: Summary', '@input:menu' = ['SEARCH', 'Summary'] }
've' = { name = 'Vary: Expired Certificates', '@input:menu' = ['SEARCH', 'Expired Certificates'] }
'vi' = { name = 'Vary: Invisible Items', '@input:menu' = ['SEARCH', 'Invisible Items'] }

'?s' = { name = 'Sort' }
'sn' = { name = 'Sort: Name', '@input:menu' = ['BY_PATH', ['View', 'Sort By', 'Name']] }
'sk' = { name = 'Sort: Kind', '@input:menu' = ['BY_PATH', ['View', 'Sort By', 'Kind']] }
'sd' = { name = 'Sort: Date Modified', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort By',
    'Date Modified',
  ],
] }
'se' = { name = 'Sort: Expiration', '@input:menu' = ['BY_PATH', ['View', 'Sort By', 'Expires']] }
'sc' = { name = 'Sort: Keychain', '@input:menu' = ['BY_PATH', ['View', 'Sort By', 'Keychain']] }
