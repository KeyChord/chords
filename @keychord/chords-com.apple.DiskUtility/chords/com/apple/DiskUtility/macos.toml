name = 'Disk Utility'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[chords]
'?v' = { name = 'View' }
'vv' = { name = 'View: Volumes Only', '@input:menu' = ['BY_PATH', ['View', 'Show Only Volumes']] }
'vd' = { name = 'View: All Devices', '@input:menu' = ['BY_PATH', ['View', 'Show All Devices']] }
'vs' = { name = 'View: Sidebar', '@input:menu' = ['SEARCH', 'Sidebar'] }
'vp' = { name = 'View: APFS Snapshots', '@input:menu' = ['SEARCH', 'APFS Snapshots'] }

'?i' = { name = 'Image' }
'io' = { name = 'Image: Open', '@input:menu' = ['BY_PATH', ['File', 'Open Disk Image…']] }
'in' = { name = 'Image: New Blank Image', '@input:menu' = [
  'BY_PATH',
  [
    'File',
    'New Image',
    'Blank Image...',
  ],
] }
'if' = { name = 'Image: New from Folder', '@input:menu' = [
  'BY_PATH',
  [
    'File',
    'New Image',
    'Image from Folder...',
  ],
] }

'?d' = { name = 'Disk' }
'di' = { name = 'Disk: Get Info', '@input:menu' = ['BY_PATH', ['File', 'Get Info']] }
'df' = { name = 'Disk: First Aid', '@input:menu' = ['BY_PATH', ['File', 'Run First Aid...']] }
'dm' = { name = 'Disk: Mount', '@input:menu' = ['BY_PATH', ['File', 'Mount']] }
'du' = { name = 'Disk: Unmount', '@input:menu' = ['BY_PATH', ['File', 'Unmount']] }
'de' = { name = 'Disk: Erase', '@input:menu' = ['BY_PATH', ['Edit', 'Erase...']] }
'dr' = { name = 'Disk: Restore', '@input:menu' = ['BY_PATH', ['Edit', 'Restore...']] }
'dp' = { name = 'Disk: Partition', '@input:menu' = ['BY_PATH', ['Edit', 'Partition...']] }
'da' = { name = 'Disk: Add APFS Volume', '@input:menu' = ['BY_PATH', ['Edit', 'Add APFS Volume…']] }
'dd' = { name = 'Disk: Delete APFS Volume', '@input:menu' = [
  'BY_PATH',
  [
    'Edit',
    'Delete APFS Volume…',
  ],
] }
