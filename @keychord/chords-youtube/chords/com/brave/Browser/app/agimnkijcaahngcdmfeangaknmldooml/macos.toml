name = 'YouTube'

[on.youtube]
file = 'youtube.js'

[chords]

# Video Commands
'?v' = { name = 'Video' }
'?vs' = { name = 'Video: Scrub' }
'vs(\d+)' = { name = 'Video: Scrub (to second)', '@input:youtube' = ['SEEK', '$1'] }
'vp' = { name = 'Video: Play', '@input:youtube' = ['PLAY'] }
'vh' = { name = 'Video: Halt', '@input:youtube' = ['PAUSE'] }
'vm' = { name = 'Video: Mute', '@input:youtube' = ['MUTE'] }
'va' = { name = 'Video: Autoplay', '@input:youtube' = ['AUTOPLAY'] }
'vc' = { name = 'Video: Closed Captions', '@input:youtube' = ['CAPTIONS'] }
'v,' = { name = 'Video: Settings', '@input:youtube' = ['SETTINGS'] }
'vt' = { name = 'Video: Theater Mode', '@input:youtube' = ['THEATER'] }
'vf' = { name = 'Video: Fullscreen', '@input:youtube' = ['FULLSCREEN'] }

# Global Commands
'js' = { name = 'Search', '@input:youtube' = ['SEARCH'] }
