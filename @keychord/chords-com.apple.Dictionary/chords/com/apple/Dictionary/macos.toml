name = 'Dictionary'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[chords]
'?w' = { name = 'Window' }
'wn' = { name = 'Window: New', '@input:menu' = ['BY_PATH', ['File', 'New Window']] }

'?t' = { name = 'Tab' }
'tn' = { name = 'Tab: New', '@input:menu' = ['BY_PATH', ['File', 'New Tab']] }

'?j' = { name = 'Jump' }
'js' = { name = 'Jump: Search for a New Word', '@input:menu' = [
  'BY_PATH',
  [
    'Edit',
    'Find',
    'Search For a New Word…',
  ],
] }

'?g' = { name = 'Goto' }
'ga' = { name = 'Goto: All Dictionaries', '@input:menu' = [
  'BY_PATH',
  [
    'Search',
    'All Dictionaries',
  ],
] }
'g[' = { name = 'Goto: Previous Dictionary', '@input:menu' = [
  'BY_PATH',
  [
    'Search',
    'Select Previous Dictionary',
  ],
] }
'g]' = { name = 'Goto: Next Dictionary', '@input:menu' = [
  'BY_PATH',
  [
    'Search',
    'Select Next Dictionary',
  ],
] }
'gf' = { name = 'Goto: Forward', '@input:menu' = ['BY_PATH', ['Go', 'Forward']] }

'?f' = { name = 'Find' }
'ff' = { name = 'Find: In Definition', '@input:menu' = ['BY_PATH', ['Edit', 'Find', 'Find…']] }

'?s' = { name = 'Settings' }
'sa' = { name = 'Settings: Sources', '@input:menu' = ['BY_PATH', ['Dictionary', 'Settings…']] }
