name = 'Safari'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'
args = ['Safari']

[on.js]
file = 'safari.js'

[on.tab]
file = 'tab.js'

[chords]
'?w' = { name = 'Window' }
'wn' = { name = 'Window: New', shortcut = 'cmd+n' }
'wp' = { name = 'Window: Private', shortcut = 'cmd+shift+n' }
'wq' = { name = 'Window: Quit', shortcut = 'cmd+shift+w' }
'wqa' = { name = 'Window: Quit All', shortcut = 'cmd+opt+shift+w' }

'?t' = { name = 'Tab' }
'tn' = { name = 'Tab: New', shortcut = 'cmd+t' }
'tq' = { name = 'Tab: Quit', command = 'Close the current tab, or pop-up', shortcut = 'cmd+w' }
'tp' = { name = 'Tab: Pin', '@input:menu' = ['BY_PATH', ['Window', 'Pin Tab']] }
'td' = { name = 'Tab: Duplicate', '@input:menu' = ['BY_PATH', ['Window', 'Duplicate Tab']] }
'tw' = { name = 'Tab: Windowize', '@input:menu' = [
  'BY_PATH',
  [
    'Window',
    'Move Tab to New Window',
  ],
] }
't]' = { name = 'Tab: Next', command = 'Jump to the next open tab', shortcut = 'ctrl+tab' }
't[' = { name = 'Tab: Previous', command = 'Jump to the previous open tab', shortcut = 'ctrl+shift+tab' }
't1' = { name = 'Tab 1', command = 'Jump to a specific tab', shortcut = 'cmd+1' }
't2' = { name = 'Tab 2', command = 'Jump to a specific tab', shortcut = 'cmd+2' }
't3' = { name = 'Tab 3', command = 'Jump to a specific tab', shortcut = 'cmd+3' }
't4' = { name = 'Tab 4', command = 'Jump to a specific tab', shortcut = 'cmd+4' }
't5' = { name = 'Tab 5', command = 'Jump to a specific tab', shortcut = 'cmd+5' }
't6' = { name = 'Tab 6', command = 'Jump to a specific tab', shortcut = 'cmd+6' }
't7' = { name = 'Tab 7', command = 'Jump to a specific tab', shortcut = 'cmd+7' }
't8' = { name = 'Tab 8', command = 'Jump to a specific tab', shortcut = 'cmd+8' }
'tl' = { name = 'Tab: Left Move', '@input:tab' = ['LEFT'] }
'tr' = { name = 'Tab: Right Move', '@input:tab' = ['RIGHT'] }

'?tg' = { name = 'Tab Group' }
'tgn' = { name = 'Tab Group: New', '@input:menu' = ['BY_PATH', ['File', 'New Empty Tab Group']] }
'tgq' = { name = 'Tab Group: Delete', '@input:menu' = ['BY_PATH', ['File', 'Delete Tab Group']] }
'tg]' = { name = 'Tab Group: Next', '@input:tab' = ['RIGHT', 'GROUP'] }
'tg[' = { name = 'Tab Group: Previous', '@input:tab' = ['LEFT', 'GROUP'] }

'js' = { name = 'JavaScript', '@input:js' = [] }
