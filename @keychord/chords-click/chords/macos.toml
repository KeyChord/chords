name = "Mouse"

[on.click]
file = 'click.js'

[chords]
'?.' = { name = "Click" }

'?..' = { name = "Double Click" }
'?.,' = { name = "Right Click" }
'?.;' = { name = "Middle Click" }
'?.-' = { name = "Drag" }
'?.,-' = { name = "Right Drag" }
'?.;-' = { name = "Middle Drag" }
'?.=' = { name = "Move Mouse" }
'?./' = { name = "Global Mouse" }
'.([.,;=/0-9-].*)' = { name = "Mouse", '@input:click' = ['$1', 'command'] }
