name = "Web chords"

[on.js]
file = 'web.js'

[chords]
'?;i' = { name = "Input" }

';i([^,.;]*)' = { name = "Input: Match", '@input:js' = ['PLACEHOLDER', '$1'] }
';i([^,.;]*\.)' = { name = "Input: Click (focus)", '@input:js' = ['PLACEHOLDER', '$1'] }
';i([^,.;]*\.,)' = { name = "Input: Right Click", '@input:js' = ['PLACEHOLDER', '$1'] }

';a([^,.;]*)' = { name = "Start Selection: Match", '@input:js' = ['SELECTION_START', '$1'] }
';a([^,.;]*\.)' = { name = "Start Selection: Select", '@input:js' = ['SELECTION_START', '$1'] }
';z([^,.;]*)' = { name = "End Selection: Match", '@input:js' = ['SELECTION_END', '$1'] }
';z([^,.;]*\.)' = { name = "End Selection: Select", '@input:js' = ['SELECTION_END', '$1'] }
';z([^,.;]*\.,)' = { name = "End Selection: Right Click", '@input:js' = ['SELECTION_END', '$1'] }

';l([^,.;]*)' = { name = "Link: Match", '@input:js' = ['LINK', '$1'] }
';l([^,.;]*\.)' = { name = "Link: Click", '@input:js' = ['LINK', '$1'] }
';l([^,.;]*\.,)' = { name = "Link: Right Click", '@input:js' = ['LINK', '$1'] }

';b([^,.;]*)' = { name = "Button: Match", '@input:js' = ['BUTTON', '$1'] }
';b([^,.;]*\.)' = { name = "Button: Click", '@input:js' = ['BUTTON', '$1'] }
';b([^,.;]*\.,)' = { name = "Button: Right Click", '@input:js' = ['BUTTON', '$1'] }

';n' = { name = "North", '@input:js' = ['SCROLL', 'NORTH'] }
';s' = { name = "South", '@input:js' = ['SCROLL', 'SOUTH'] }
';e' = { name = "East", '@input:js' = ['SCROLL', 'EAST'] }
';w' = { name = "West", '@input:js' = ['SCROLL', 'WEST'] }
