name = 'macOS Spaces'

[meta]
chord = '>=0.3.0'

# Every chord starts with `<>`, which Chord replaces with the prefix chosen in Settings → Chords
# → Placeholders or inherits the global symbol before its letter.
[placeholders]
"<>" = { name = 'Space prefix', default = 's' }

[on.space]
file = 'spaces.js'

[chords]
'?<>' = { name = 'Spaces' }
'<>[' = { name = 'Space: Previous', '@input:space' = ['PREVIOUS'] }
'<>]' = { name = 'Space: Next', '@input:space' = ['NEXT'] }
'<>l' = { name = 'Space: Left', '@input:space' = ['PREVIOUS'] }
'<>r' = { name = 'Space: Right', '@input:space' = ['NEXT'] }
'<>1' = { name = 'Space: Desktop 1', '@input:space' = ['1'] }
'<>2' = { name = 'Space: Desktop 2', '@input:space' = ['2'] }
'<>3' = { name = 'Space: Desktop 3', '@input:space' = ['3'] }
'<>4' = { name = 'Space: Desktop 4', '@input:space' = ['4'] }
'<>5' = { name = 'Space: Desktop 5', '@input:space' = ['5'] }
'<>6' = { name = 'Space: Desktop 6', '@input:space' = ['6'] }
'<>7' = { name = 'Space: Desktop 7', '@input:space' = ['7'] }
'<>8' = { name = 'Space: Desktop 8', '@input:space' = ['8'] }
'<>9' = { name = 'Space: Desktop 9', '@input:space' = ['9'] }
