name = 'macOS Spaces'

[meta]
chord = '>=0.3.0'

# Every chord starts with `<>`, which Chord replaces with the prefix chosen in Settings → Chords
# → Placeholders or inherits the global symbol before its letter.
[placeholders]
"<>" = { name = 'Space prefix', default = 's' }

[chords]
# Spaces (Mission Control shortcuts must be enabled in System Settings)
'?<>' = { name = 'Spaces' }
'<>[' = { name = 'Space: Previous', shortcut = 'ctrl+left' }
'<>]' = { name = 'Space: Next', shortcut = 'ctrl+right' }
'<>l' = { name = 'Space: Left', shortcut = 'ctrl+left' }
'<>r' = { name = 'Space: Right', shortcut = 'ctrl+right' }
'<>1' = { name = 'Space: Desktop 1', shortcut = 'ctrl+1' }
'<>2' = { name = 'Space: Desktop 2', shortcut = 'ctrl+2' }
'<>3' = { name = 'Space: Desktop 3', shortcut = 'ctrl+3' }
'<>4' = { name = 'Space: Desktop 4', shortcut = 'ctrl+4' }
'<>5' = { name = 'Space: Desktop 5', shortcut = 'ctrl+5' }
'<>6' = { name = 'Space: Desktop 6', shortcut = 'ctrl+6' }
'<>7' = { name = 'Space: Desktop 7', shortcut = 'ctrl+7' }
'<>8' = { name = 'Space: Desktop 8', shortcut = 'ctrl+8' }
'<>9' = { name = 'Space: Desktop 9', shortcut = 'ctrl+9' }
