name = 'iPhone Mirroring'

[on.tap]
file = 'screen-continuity.js'

[on.hover]
file = 'screen-continuity.js'
args = ['HOVER']

[chords]
'?t' = { name = 'Tap' }
't(.+)' = { name = 'Tap', '@input:tap' = ['$1'] }

'?h' = { name = 'Hover' }
'h(.+)' = { name = 'Hover', '@input:hover' = ['$1'] }

'?g' = { name = 'Goto' }
'gh' = { name = 'Goto: Home Screen', shortcut = 'cmd+1' }
'ga' = { name = 'Goto: App Switcher', shortcut = 'cmd+2' }
'gs' = { name = 'Goto: Spotlight', shortcut = 'cmd+3' }
'gc' = { name = 'Goto: Command Centre', shortcut = 'cmd+4' }

'?s' = { name = 'Size' }
's=' = { name = 'Size: Increase (Zoom)', shortcut = 'cmd+=' }
's-' = { name = 'Size: Decrease (Zoom)', shortcut = 'cmd+-' }
's0' = { name = 'Size: Actual', shortcut = 'cmd+0' }
'si' = { name = 'Size: iPhone', shortcut = 'cmd+9' }
