name = "Activity Monitor"

[handler.menu]
file = "@keychord/chords-menu/js/menu.js"

[chords]
'/am' = { name = "Activity Monitor", shell = "open -a 'Activity Monitor'" }

'?v' = { name = "View" }
va = { name = "View: All Processes", '@input:menu' = ["View", "All Processes"] }
vh = { name = "View: Hierarchially, All Processes", '@input:menu' = [
  "View",
  "All Processes, Hierarchically",
] }
vm = { name = "View: My Processes", '@input:menu' = ["View", "My Processes"] }
vs = { name = "View: Selected Processes", '@input:menu' = ["View", "Selected Processes"] }
vy = { name = "View: System Processes", '@input:menu' = ["View", "System Processes"] }
vo = { name = "View: Other Users' Processes", '@input:menu' = ["View", "Other Users’ Processes"] }
vc = { name = "View: Current (Active) Processes", '@input:menu' = ["View", "Active Processes"] }
vi = { name = "View: Inactive Processes", '@input:menu' = ["View", "Inactive Processes"] }
vg = { name = "View: GPU Processes", '@input:menu' = ["View", "GPU Processes"] }
vw = { name = "View: Windowed Processes", '@input:menu' = ["View", "Windowed Processes"] }
vl = { name = "View: Last 12 Hour Applications", '@input:menu' = [
  "View",
  "Applications in last 12 hours",
] }
vp = { name = "View: Processes, by GPU", '@input:menu' = ["View", "Processes, by GPU"] }

'?p' = { name = "Process" }
pf = { name = "Process: Filter", '@input:menu' = ["View", "Filter Processes"] }
pi = { name = "Process: Inspect", '@input:menu' = ["View", "Inspect Process"] }
ps = { name = "Process: Sample", '@input:menu' = ["View", "Sample Process"] }
pq = { name = "Process: Quit", '@input:menu' = ["View", "Quit Process"] }
pss = { name = "Process: Send Signal", '@input:menu' = ["View", "Send Signal to Process..."] }
psd = { name = "Process: Show Deltas", '@input:menu' = ["View", "Show Deltas for Process"] }

'?r' = { name = "Run" }
rs = { name = "Run: Spindump", '@input:menu' = ["View", "Run Spindump"] }
rd = { name = "Run: Diagonstics for System", '@input:menu' = ["View", "Run System Diagnostics..."] }

'?c' = { name = "Columns" }
cpi = { name = "Columns: Process ID", '@input:menu' = ["View", "Columns", "Process ID"] }
