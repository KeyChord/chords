name = 'Linux System Shortcuts'

[meta]
chord = '>=0.3.4'

[placeholders]
"<>" = { name = 'System shortcuts prefix', default = 's' }

[chords]
'?<>' = { name = 'System Shortcuts' }
'<>0' = { name = 'Activities Overview', shortcut = 'super' }
'<>a' = { name = 'Show Applications', shortcut = 'super+a' }
'<>c' = { name = 'Quick Settings', shortcut = 'super+s' }
'<>t' = { name = 'Notifications and Calendar', shortcut = 'super+v' }
'<>r' = { name = 'Run Command', shortcut = 'alt+f2' }
'<>ls' = { name = 'Lock Screen', shortcut = 'super+l' }

'?<>b' = { name = 'Brightness' }
'<>bu' = { name = 'Brightness Up', shortcut = 'BrightnessUp' }
'<>bd' = { name = 'Brightness Down', shortcut = 'BrightnessDown' }

'?<>v' = { name = 'Volume' }
'<>vu' = { name = 'Volume Up', shortcut = 'AudioVolumeUp' }
'<>vd' = { name = 'Volume Down', shortcut = 'AudioVolumeDown' }
'<>vm' = { name = 'Volume Mute', shortcut = 'AudioVolumeMute' }

'?<>w' = { name = 'Window' }
'<>w' = { name = 'Window Menu', shortcut = 'alt+space' }
'<>wq' = { name = 'Close Window', shortcut = 'alt+f4' }
