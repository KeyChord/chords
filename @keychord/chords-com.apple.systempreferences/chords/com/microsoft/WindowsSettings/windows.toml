'gia' = { name = 'Go to Email & Accounts', shell = 'start "" "ms-settings:emailandaccounts"' }
'gke' = { name = 'Go to Typing', shell = 'start "" "ms-settings:typing"' }
'gtr' = { name = 'Go to Mouse & Touchpad', shell = 'start "" "ms-settings:mousetouchpad"' }
'gpr' = { name = 'Go to Printers & Scanners', shell = 'start "" "ms-settings:printers"' }
