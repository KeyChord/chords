    'Ticket',
    'Remove Identity',
  ],
] }
'ts' = { name = 'Ticket: Set as Default', '@input:menu' = [
  'BY_PATH',
  [
    'Ticket',
    'Set as Default',
  ],
] }
'tp' = { name = 'Ticket: Change Password', '@input:menu' = [
  'BY_PATH',
  [
    'Ticket',
    'Change Password',
  ],
] }
'ti' = { name = 'Ticket: Diagnostic Information', '@input:menu' = [
  'BY_PATH',
  [
    'Ticket',
    'Diagnostic Information',
  ],
] }
