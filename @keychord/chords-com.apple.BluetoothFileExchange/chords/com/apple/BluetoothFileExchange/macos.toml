name = 'Bluetooth File Exchange'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[chords]
'?f' = { name = 'File' }
'fs' = { name = 'File: Send File', '@input:menu' = ['BY_PATH', ['File', 'Send File…']] }
'fb' = { name = 'File: Browse Device', '@input:menu' = ['BY_PATH', ['File', 'Browse Device…']] }

'?g' = { name = 'Goto' }
'gs' = { name = 'Goto: Settings', '@input:menu' = [
  'BY_PATH',
  [
    'Bluetooth File Exchange',
    'Preferences...',
  ],
] }
