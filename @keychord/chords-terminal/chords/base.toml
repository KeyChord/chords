# Cmd+1 to Cmd+8 select tabs 1 to 8 by default in each terminal that imports this file.
# Cmd+9 selects the last tab in most of them, so only Terminal adds 't9'.
name = 'Terminal Tabs'

[chords]
'?t' = { name = 'Tab' }
't1' = { name = 'Tab 1', shortcut = 'cmd+1' }
't2' = { name = 'Tab 2', shortcut = 'cmd+2' }
't3' = { name = 'Tab 3', shortcut = 'cmd+3' }
't4' = { name = 'Tab 4', shortcut = 'cmd+4' }
't5' = { name = 'Tab 5', shortcut = 'cmd+5' }
't6' = { name = 'Tab 6', shortcut = 'cmd+6' }
't7' = { name = 'Tab 7', shortcut = 'cmd+7' }
't8' = { name = 'Tab 8', shortcut = 'cmd+8' }
