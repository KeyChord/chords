'sk' = { name = 'Sort: Kind', '@input:menu' = ['BY_PATH', ['View', 'Sort By', 'Kind']] }
'so' = { name = 'Sort: Opened Date', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort By',
    'Date Last Opened',
  ],
] }
'sa' = { name = 'Sort: Added Date', '@input:menu' = ['BY_PATH', ['View', 'Sort By', 'Date Added']] }
'sm' = { name = 'Sort: Modified Date', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort By',
    'Date Modified',
  ],
] }
'sc' = { name = 'Sort: Created Date', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort By',
    'Date Created',
  ],
] }
'ss' = { name = 'Sort: Size', '@input:menu' = ['BY_PATH', ['View', 'Sort By', 'Size']] }
'st' = { name = 'Sort: Tags', '@input:menu' = ['BY_PATH', ['View', 'Sort By', 'Tags']] }

'?c' = { name = 'Clean' }
'cn' = { name = 'Clean: Name', '@input:menu' = ['BY_PATH', ['View', 'Clean Up By', 'Name']] }
'ck' = { name = 'Clean: Kind', '@input:menu' = ['BY_PATH', ['View', 'Clean Up By', 'Kind']] }
'cm' = { name = 'Clean: Modified Date', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Clean Up By',
    'Date Modified',
  ],
] }
'cc' = { name = 'Clean: Created Date', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Clean Up By',
    'Date Created',
  ],
] }
'cs' = { name = 'Clean: Size', '@input:menu' = ['BY_PATH', ['View', 'Clean Up By', 'Size']] }
'ct' = { name = 'Clean: Tags', '@input:menu' = ['BY_PATH', ['View', 'Clean Up By', 'Tags']] }

'?t' = { name = 'Toggle' }
'ta' = { name = 'Tabs: All', '@input:menu' = ['BY_PATH', ['View', 'Show All Tabs']] }
'tg' = { name = 'Toggle: Groups', '@input:menu' = ['BY_PATH', ['View', 'Use Groups']] }
'tt' = { name = 'Toggle: Tabs', '@input:menu' = ['SEARCH', 'Tab Bar'] }
'th' = { name = 'Toggle: Hidden', shortcut = 'cmd+shift+.' }
'ts' = { name = 'Toggle Sidebar', shortcut = 'cmd+ctrl+s' }
'tp' = { name = 'Toggle Preview', shortcut = 'cmd+shift+p' }
'tb' = { name = 'Toggle Status Bar', '@input:menu' = ['SEARCH', 'Status Bar'] }
'to' = { name = 'Toggle Toolbar', shortcut = 'cmd+opt+t' }
't/' = { name = 'Toggle Path Bar', shortcut = 'cmd+opt+p' }
'te' = { name = 'Trash: Empty', '@input:menu' = ['BY_PATH', ['Finder', 'Empty Trash…']] }
'tef' = { name = 'Trash: Empty Force', '@input:menu' = ['BY_KEY', ['Finder', 'Empty Trash']] }
