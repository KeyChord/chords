name = 'Stocks'

[on.menu]
file = '@keychord/chords-menu/js/menu.js'

[chords]
'?w' = { name = 'Window' }
'wn' = { name = 'Window: New', '@input:menu' = ['BY_PATH', ['File', 'New Window']] }

'?t' = { name = 'Tab' }
'tn' = { name = 'Tab: New', '@input:menu' = ['BY_PATH', ['File', 'New Tab']] }

'?j' = { name = 'Jump' }
'js' = { name = 'Jump: Ticker Search', shortcut = 'cmd+f' }

'?v' = { name = 'Vary' }
'vs' = { name = 'Vary: Sidebar', '@input:menu' = [
  'BY_FIRST_PATH',
  [
    [
      'View',
      'Show Sidebar',
    ],
    [
      'View',
      'Hide Sidebar',
    ],
  ],
] }

'?l' = { name = 'Watchlist' }
'ln' = { name = 'Watchlist: New', '@input:menu' = ['BY_PATH', ['File', 'New Watchlist']] }
'lm' = { name = 'Watchlist: Manage', '@input:menu' = ['BY_PATH', ['File', 'Manage Watchlists']] }

'?s' = { name = 'Sort' }
'sm' = { name = 'Sort: Manual', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort Watchlist By',
    'Manual',
  ],
] }
'ss' = { name = 'Sort: Symbol', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort Watchlist By',
    'Symbol',
  ],
] }
'sn' = { name = 'Sort: Name', '@input:menu' = ['BY_PATH', ['View', 'Sort Watchlist By', 'Name']] }
'sc' = { name = 'Sort: Price Change', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort Watchlist By',
    'Price Change',
  ],
] }
'sp' = { name = 'Sort: Percentage Change', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort Watchlist By',
    'Percentage Change',
  ],
] }
'sk' = { name = 'Sort: Market Cap', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort Watchlist By',
    'Market Cap',
  ],
] }
'sa' = { name = 'Sort: Ascending', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort Watchlist By',
    'Ascending',
  ],
] }
'sd' = { name = 'Sort: Descending', '@input:menu' = [
  'BY_PATH',
  [
    'View',
    'Sort Watchlist By',
    'Descending',
  ],
] }
