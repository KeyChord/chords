name = 'AeroSpace'

[meta]
chord = '>=0.3.0'
# TODO: make these properties work
'$wrap' = false

# Every chord starts with `<>`, which Chord replaces with the prefix chosen in Settings → Chords
# → Placeholders or inherits the global symbol before its letter.
[placeholders]
"<>" = { name = 'Window management prefix', default = 'a' }

# The same chord suffixes as @keychord/chords-rift. Each
# chord runs one `aerospace` command (https://nikitabobko.github.io/AeroSpace/commands). Rift
# chords with no AeroSpace counterpart are left out: master/stack (`<>m`, `<>p`, `<>lm…`), BSP
# (`<>lb`) and scrolling columns (`<>lc`, `<>c…`).
[chords]
'?<>' = { name = 'AeroSpace' }
'<>q' = { name = 'Quit Window', shell = 'aerospace close' }
'<>v' = { name = 'Vary: AeroSpace On/Off', shell = 'aerospace enable toggle' }

# Focus
'<>w' = { name = 'West (Window)', shell = 'aerospace focus left' }
'<>e' = { name = 'East (Window)', shell = 'aerospace focus right' }
'<>n' = { name = 'North (Window)', shell = 'aerospace focus up' }
'<>s' = { name = 'South (Window)', shell = 'aerospace focus down' }
'<>]' = { name = 'Next (Window)', shell = 'aerospace focus dfs-next' }
'<>[' = { name = 'Previous (Window)', shell = 'aerospace focus dfs-prev' }

# Move
'<>l' = { name = 'Left (Move Window)', shell = 'aerospace move left' }
'<>r' = { name = 'Right (Move Window)', shell = 'aerospace move right' }
'<>u' = { name = 'Up (Move Window)', shell = 'aerospace move up' }
'<>d' = { name = 'Down (Move Window)', shell = 'aerospace move down' }

# Join
'?<>j' = { name = 'Join' }
'<>jl' = { name = 'Join: Left', shell = 'aerospace join-with left' }
'<>jr' = { name = 'Join: Right', shell = 'aerospace join-with right' }
'<>ju' = { name = 'Join: Up', shell = 'aerospace join-with up' }
'<>jd' = { name = 'Join: Down', shell = 'aerospace join-with down' }
# AeroSpace can't unjoin one window; this flattens the whole workspace instead.
'<>jx' = { name = 'Join: Unjoin All (Flatten Workspace)', shell = 'aerospace flatten-workspace-tree' }

# Toggles: `layout` with several layouts applies the first one that isn't the current one.
'?<>v' = { name = 'Vary' }
'<>vf' = { name = 'Vary: Floating', shell = 'aerospace layout floating tiling' }
'<>vs' = { name = 'Vary: Stacked (Accordion)', shell = 'aerospace layout accordion tiles' }
'<>vo' = { name = 'Vary: Orientation', shell = 'aerospace layout horizontal vertical' }

# Fullscreen: AeroSpace's fullscreen keeps the outer gaps unless told otherwise.
'?<>z' = { name = 'Zoom' }
'<>zf' = { name = 'Zoom: Fullscreen', shell = 'aerospace fullscreen --no-outer-gaps' }
'<>zg' = { name = 'Zoom: Fullscreen Within Gaps', shell = 'aerospace fullscreen' }

# Resize, in points
'?<>r' = { name = 'Resize' }
'<>r=' = { name = 'Resize: Increase', shell = 'aerospace resize smart +50' }
'<>r-' = { name = 'Resize: Decrease', shell = 'aerospace resize smart -50' }
'<>rw=' = { name = 'Resize: Increase Width', shell = 'aerospace resize width +50' }
'<>rw-' = { name = 'Resize: Decrease Width', shell = 'aerospace resize width -50' }
'<>rh=' = { name = 'Resize: Increase Height', shell = 'aerospace resize height +50' }
'<>rh-' = { name = 'Resize: Decrease Height', shell = 'aerospace resize height -50' }
'<>b' = { name = 'Balance Sizes', shell = 'aerospace balance-sizes' }

# Layout modes: `--root` changes the whole workspace. AeroSpace floats windows, not workspaces,
# so `<>lf` floats the focused window.
'?<>l' = { name = 'Left / Layout' }
'<>lt' = { name = 'Layout: Tiles', shell = 'aerospace layout --root tiles' }
'<>ls' = { name = 'Layout: Stack (Accordion)', shell = 'aerospace layout --root accordion' }
'<>lf' = { name = 'Layout: Floating (Window)', shell = 'aerospace layout floating' }

# Workspaces: AeroSpace workspaces are named, and `0`–`9` are their names. Chord runs commands
# without a terminal, which `workspace next|prev` rejects as implicit stdin without `--no-stdin`.
'?<>w' = { name = 'Workspace' }
'<>w]' = { name = 'Workspace: Next', shell = 'aerospace workspace --no-stdin next' }
'<>w[' = { name = 'Workspace: Previous', shell = 'aerospace workspace --no-stdin prev' }
'<>wk' = { name = 'Workspace: Back (Last Used)', shell = 'aerospace workspace-back-and-forth' }
'<>w0' = { name = 'Workspace: 0', shell = 'aerospace workspace 0' }
'<>w1' = { name = 'Workspace: 1', shell = 'aerospace workspace 1' }
'<>w2' = { name = 'Workspace: 2', shell = 'aerospace workspace 2' }
'<>w3' = { name = 'Workspace: 3', shell = 'aerospace workspace 3' }
'<>w4' = { name = 'Workspace: 4', shell = 'aerospace workspace 4' }
'<>w5' = { name = 'Workspace: 5', shell = 'aerospace workspace 5' }
'<>w6' = { name = 'Workspace: 6', shell = 'aerospace workspace 6' }
'<>w7' = { name = 'Workspace: 7', shell = 'aerospace workspace 7' }
'<>w8' = { name = 'Workspace: 8', shell = 'aerospace workspace 8' }
'<>w9' = { name = 'Workspace: 9', shell = 'aerospace workspace 9' }
'<>wl' = { name = 'Workspace: Left (Display)', shell = 'aerospace move-workspace-to-monitor left' }
'<>wr' = { name = 'Workspace: Right (Display)', shell = 'aerospace move-workspace-to-monitor right' }
'<>wu' = { name = 'Workspace: Up (Display)', shell = 'aerospace move-workspace-to-monitor up' }
'<>wd' = { name = 'Workspace: Down (Display)', shell = 'aerospace move-workspace-to-monitor down' }

'?<>m' = { name = 'Move Window' }
'<>m0' = { name = 'Move: (Workspace) 0', shell = 'aerospace move-node-to-workspace 0' }
'<>m1' = { name = 'Move: (Workspace) 1', shell = 'aerospace move-node-to-workspace 1' }
'<>m2' = { name = 'Move: (Workspace) 2', shell = 'aerospace move-node-to-workspace 2' }
'<>m3' = { name = 'Move: (Workspace) 3', shell = 'aerospace move-node-to-workspace 3' }
'<>m4' = { name = 'Move: (Workspace) 4', shell = 'aerospace move-node-to-workspace 4' }
'<>m5' = { name = 'Move: (Workspace) 5', shell = 'aerospace move-node-to-workspace 5' }
'<>m6' = { name = 'Move: (Workspace) 6', shell = 'aerospace move-node-to-workspace 6' }
'<>m7' = { name = 'Move: (Workspace) 7', shell = 'aerospace move-node-to-workspace 7' }
'<>m8' = { name = 'Move: (Workspace) 8', shell = 'aerospace move-node-to-workspace 8' }
'<>m9' = { name = 'Move: (Workspace) 9', shell = 'aerospace move-node-to-workspace 9' }
'<>ml' = { name = 'Move: Left (Display)', shell = 'aerospace move-node-to-monitor left' }
'<>mr' = { name = 'Move: Right (Display)', shell = 'aerospace move-node-to-monitor right' }
'<>mu' = { name = 'Move: Up (Display)', shell = 'aerospace move-node-to-monitor up' }
'<>md' = { name = 'Move: Down (Display)', shell = 'aerospace move-node-to-monitor down' }

'?<>f' = { name = 'Follow Window to Workspace' }
'<>f0' = { name = 'Follow: (to workspace) 0', shell = 'aerospace move-node-to-workspace --focus-follows-window 0' }
'<>f1' = { name = 'Follow: (to workspace) 1', shell = 'aerospace move-node-to-workspace --focus-follows-window 1' }
'<>f2' = { name = 'Follow: (to workspace) 2', shell = 'aerospace move-node-to-workspace --focus-follows-window 2' }
'<>f3' = { name = 'Follow: (to workspace) 3', shell = 'aerospace move-node-to-workspace --focus-follows-window 3' }
'<>f4' = { name = 'Follow: (to workspace) 4', shell = 'aerospace move-node-to-workspace --focus-follows-window 4' }
'<>f5' = { name = 'Follow: (to workspace) 5', shell = 'aerospace move-node-to-workspace --focus-follows-window 5' }
'<>f6' = { name = 'Follow: (to workspace) 6', shell = 'aerospace move-node-to-workspace --focus-follows-window 6' }
'<>f7' = { name = 'Follow: (to workspace) 7', shell = 'aerospace move-node-to-workspace --focus-follows-window 7' }
'<>f8' = { name = 'Follow: (to workspace) 8', shell = 'aerospace move-node-to-workspace --focus-follows-window 8' }
'<>f9' = { name = 'Follow: (to workspace) 9', shell = 'aerospace move-node-to-workspace --focus-follows-window 9' }

# Displays
'?<>d' = { name = 'Display' }
'<>dw' = { name = 'Display: West', shell = 'aerospace focus-monitor left' }
'<>de' = { name = 'Display: East', shell = 'aerospace focus-monitor right' }
'<>dn' = { name = 'Display: North', shell = 'aerospace focus-monitor up' }
'<>ds' = { name = 'Display: South', shell = 'aerospace focus-monitor down' }

# Config. Play and Halt turn window management on and off, like `<>v`.
'?<>,' = { name = 'AeroSpace Config' }
'<>,r' = { name = 'AeroSpace: Reload', shell = 'aerospace reload-config' }
'<>,p' = { name = 'AeroSpace: Play (Start)', shell = 'aerospace enable on' }
'<>,h' = { name = 'AeroSpace: Halt (Stop)', shell = 'aerospace enable off' }
