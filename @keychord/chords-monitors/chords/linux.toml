name = 'Monitors'

[meta]
chord = '>=0.3.4'

[on.monitor]
file = 'desktop-monitor.js'

# Every chord starts with `<>`, which Chord replaces with the prefix chosen in Settings → Chords
# → Placeholders or inherits the global symbol before its letter.
[placeholders]
"<>" = { name = 'Monitor prefix', default = 'm' }

[chords]
# Monitors (focus a display without moving windows)
'?<>' = { name = 'Monitors' }
'?<>"1-9"' = { name = 'Monitor: Focus #' }
'<>([1-9]\d*)' = { name = 'Monitor: Focus $1', '@input:monitor' = ['$1'] }
'<>[' = { name = 'Monitor: Previous', '@input:monitor' = ['PREVIOUS'] }
'<>]' = { name = 'Monitor: Next', '@input:monitor' = ['NEXT'] }
'<>l' = { name = 'Monitor: Left', '@input:monitor' = ['LEFT'] }
'<>r' = { name = 'Monitor: Right', '@input:monitor' = ['RIGHT'] }
'<>t' = { name = 'Monitor: Top', '@input:monitor' = ['UP'] }
'<>b' = { name = 'Monitor: Bottom', '@input:monitor' = ['DOWN'] }
