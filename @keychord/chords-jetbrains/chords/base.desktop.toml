'gsm' = { name = "Goto Super Method", shortcut = "ctrl+u" }
'gi' = { name = "Goto Implementation(s)", shortcut = "ctrl+alt+b" }
'gs' = { name = "Goto Symbol", shortcut = "ctrl+alt+shift+n" }
