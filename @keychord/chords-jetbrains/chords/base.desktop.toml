name = "JetBrains Desktop Chords"

# Shared bindings from JetBrains' Windows and XWin keymaps.
[chords]
'?e' = { name = "Editor" }
'es' = { name = "Editor: Solutions", shortcut = "alt+enter" }
'ef' = { name = "Editor: Focus", shortcut = "esc" }
'eq' = { name = "Editor: Quit", shortcut = "ctrl+f4" }

'?t' = { name = "Tab" }
'tv' = { name = "Tab: Previous", shortcut = "alt+left" }
'tx' = { name = "Tab: Next", shortcut = "alt+right" }
'tb' = { name = "Tab: Switch to Recent", shortcut = "ctrl+tab" }

'?f' = { name = "Find/File" }
'fr' = { name = "Find and Replace", shortcut = "ctrl+r" }
'f]' = { name = "Find: Next", shortcut = "f3" }
'f[' = { name = "Find: Previous", shortcut = "shift+f3" }
'fg' = { name = "Find Globally", shortcut = "ctrl+shift+f" }
'frg' = { name = "Find and Replace Globally", shortcut = "ctrl+shift+r" }
'fa' = { name = "Find Action", shortcut = "ctrl+shift+a" }

'fp' = { name = "File: Path", shortcut = "ctrl+shift+c" }
'fb' = { name = "File: Back", shortcut = "ctrl+e" }
'fn' = { name = "File: New", shortcut = "ctrl+alt+insert" }
'fns' = { name = "File: New Scratch", shortcut = "ctrl+alt+shift+insert" }
'ft' = { name = "File: Safe Delete", shortcut = "alt+delete" }
'fvs' = { name = "File: View Structure", shortcut = "ctrl+f12" }

'?b' = { name = "Build" }
'bp' = { name = "Build Project", shortcut = "ctrl+f9" }
'br' = { name = "Build: Rebuild", shortcut = "ctrl+shift+f9" }

'?s' = { name = "Search" }
'sg' = { name = "Search: Globally", shortcut = "shift shift" }
'st' = { name = "Search: Types", shortcut = "ctrl+n" }
'sf' = { name = "Search: Files", shortcut = "ctrl+shift+n" }
'sy' = { name = "Search: Symbols", shortcut = "ctrl+alt+shift+n" }
'sa' = { name = "Search: All", shortcut = "ctrl+shift+a" }

'ph' = { name = "Paste from History...", shortcut = "ctrl+shift+v" }
