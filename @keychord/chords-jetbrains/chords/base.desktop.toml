'lc' = { name = "Line: Clone", shortcut = "ctrl+d" }
'tgc' = { name = "Toggle Case", shortcut = "ctrl+shift+u" }
'os' = { name = "Open Source", shortcut = "shift+f4" }
'fsi' = { name = "Font Size: Increase", shortcut = "alt+shift+." }
