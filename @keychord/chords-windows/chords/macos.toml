name = 'macOS Windows'

[meta]
chord = '>=0.3.0'

[on.window]
file = 'window.js'

# Every chord starts with `<>`, which Chord replaces with the prefix chosen in Settings → Chords
# → Placeholders or inherits the global symbol before its letter.
[placeholders]
"<>" = { name = 'Window prefix', default = 'w' }

[chords]
# Built-in macOS window management shortcuts
# Can be overriden if using a dedicated window manager such as yabai, Aerospace, etc.
'?<>' = { name = 'Window' }

# Native edge/corner snaps preserve size; stretch commands change one dimension.
'<>l' = { name = 'Window: left', '@input:window' = ['PRESET', 'LEFT'] }
'<>r' = { name = 'Window: right', '@input:window' = ['PRESET', 'RIGHT'] }
'<>t' = { name = 'Window: top', '@input:window' = ['PRESET', 'TOP'] }
'<>b' = { name = 'Window: bottom', '@input:window' = ['PRESET', 'BOTTOM'] }
'<>tl' = { name = 'Window: top-left', '@input:window' = ['PRESET', 'TOP_LEFT'] }
'<>tr' = { name = 'Window: top-right', '@input:window' = ['PRESET', 'TOP_RIGHT'] }
'<>bl' = { name = 'Window: bottom-left', '@input:window' = ['PRESET', 'BOTTOM_LEFT'] }
'<>br' = { name = 'Window: bottom-right', '@input:window' = ['PRESET', 'BOTTOM_RIGHT'] }
'<>lr' = { name = 'Window: horizontal', '@input:window' = ['PRESET', 'HORIZONTAL'] }
'<>rl' = { name = 'Window: horizontal', '@input:window' = ['PRESET', 'HORIZONTAL'] }
'<>tb' = { name = 'Window: vertical', '@input:window' = ['PRESET', 'VERTICAL'] }
'<>bt' = { name = 'Window: vertical', '@input:window' = ['PRESET', 'VERTICAL'] }
'<>f' = { name = 'Window: fill', '@input:window' = ['PRESET', 'FILL'] }
'<>c' = { name = 'Window: center', '@input:window' = ['PRESET', 'CENTER'] }

'?<>px' = { name = 'Window: Position, X' }
'<>px(.+)' = { name = 'Window: Position, X (Set)', '@input:window' = ['POSITION', '$1', 'X'] }
'?<>py' = { name = 'Window: Position, Y' }
'<>py(.+)' = { name = 'Window: Position, Y (Set)', '@input:window' = ['POSITION', '$1', 'Y'] }
'?<>p' = { name = 'Window: Position' }
'<>p([^xy].*)' = { name = 'Window: Position (Set)', '@input:window' = ['POSITION', '$1'] }

'?<>dw' = { name = 'Window: Dimensions, Width' }
'<>dw([^=-].*)' = { name = 'Window: Dimensions, Width (Set)', '@input:window' = [
  'DIMENSIONS',
  '$1',
  'WIDTH',
] }
'?<>dw=' = { name = 'Window: Dimensions, Width (Increase)' }
'<>dw=([0-9]?)' = { name = 'Window: Dimensions, Width (Increase)', '@input:window' = [
  'DIMENSIONS_INCREASE',
  '$1',
  'WIDTH',
] }
'?<>dw-' = { name = 'Window: Dimensions, Width (Decrease)' }
'<>dw-([0-9]?)' = { name = 'Window: Dimensions, Width (Decrease)', '@input:window' = [
  'DIMENSIONS_DECREASE',
  '$1',
  'WIDTH',
] }
'?<>dh' = { name = 'Window: Dimensions, Height' }
'<>dh([^=-].*)' = { name = 'Window: Dimensions, Height (Set)', '@input:window' = [
  'DIMENSIONS',
  '$1',
  'HEIGHT',
] }
'?<>dh=' = { name = 'Window: Dimensions, Height (Increase)' }
'<>dh=([0-9]?)' = { name = 'Window: Dimensions, Height (Increase)', '@input:window' = [
  'DIMENSIONS_INCREASE',
  '$1',
  'HEIGHT',
] }
'?<>dh-' = { name = 'Window: Dimensions, Height (Decrease)' }
'<>dh-([0-9]?)' = { name = 'Window: Dimensions, Height (Decrease)', '@input:window' = [
  'DIMENSIONS_DECREASE',
  '$1',
  'HEIGHT',
] }
'?<>d' = { name = 'Window: Dimensions' }
'<>d([^wh=-].*)' = { name = 'Window: Dimensions (Set)', '@input:window' = ['DIMENSIONS', '$1'] }
'?<>d=' = { name = 'Window: Dimensions (Increase)' }
'<>d=([0-9]?)' = { name = 'Window: Dimensions (Increase)', '@input:window' = [
  'DIMENSIONS_INCREASE',
  '$1',
] }
'?<>d-' = { name = 'Window: Dimensions (Decrease)' }
'<>d-([0-9]?)' = { name = 'Window: Dimensions (Decrease)', '@input:window' = [
  'DIMENSIONS_DECREASE',
  '$1',
] }

'<>([0-9\s-]+)' = { name = 'Window: Dimensions + Position', '@input:window' = ['FRAME', '$1'] }

'?<>s' = { name = 'Window: Space' }
'<>s(\d+)' = { name = 'Window: Space $1 (Move)', '@input:window' = ['SPACE', '$1'] }
'<>s]' = { name = 'Window: Space (Next)', '@input:window' = ['SPACE', 'NEXT'] }
'<>s[' = { name = 'Window: Space (Previous)', '@input:window' = ['SPACE', 'PREVIOUS'] }

'<>h' = { name = 'Window: Hide', shortcut = 'cmd+h' }
'<>m' = { name = 'Window: Minimize', shortcut = 'cmd+m' }
'<>q' = { name = 'Window: Quit', shortcut = 'cmd+q' }

'<>[' = { name = 'Window: Previous', '@input:window' = ['CYCLE', 'PREVIOUS'] }
'<>]' = { name = 'Window: Next', '@input:window' = ['CYCLE', 'NEXT'] }
