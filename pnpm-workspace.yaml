packages:
  - "@keychord/*"
  - packages/*
  - packages/com/npmjs/*
  - packages/dev/improve/chords/configs/*
  - packages/dev/improve/chords/configs/mirrors/*
catalog:
  "@keychord/config": ^0.0.12
  "@keychord/tsconfig": ^0.0.6
  typescript: ^7.0.2
  vite-plus: ^1.2.0

# We don't use strict because we want users to be able to directly pull dependencies from GitHub
catalogMode: manual

allowBuilds:
  esbuild@0.27.7: true
  esbuild@0.28.2: true

# For local development with a sibling config checkout, add:
# overrides:
#   "@keychord/config": "link:../config"

minimumReleaseAgeExclude:
  - "@keychord/config@0.0.12"
