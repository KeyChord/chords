packages:
  - "@keychord/*"
  - packages/*
  - packages/com/npmjs/*
  - packages/dev/improve/chords/configs/*
  - packages/dev/improve/chords/configs/mirrors/*
catalog:
  "@keychord/config": ^0.0.9
  "@keychord/tsconfig": ^0.0.6
  typescript: ^6.0.2
  vite-plus: ^0.1.15

# We don't use strict because we want users to be able to directly pull dependencies from GitHub
catalogMode: manual

allowBuilds:
  esbuild@0.27.7: true

overrides:
  # Temporary until the config with the shared test runtime is published.
  "@keychord/config": "link:../config"
