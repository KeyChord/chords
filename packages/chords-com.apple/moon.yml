$schema: "https://moonrepo.dev/schemas/project.json"

layer: library
language: typescript

tasks:
  # Builds this package's own Swift addon, and vendors @keychord/chords-menu's
  # prebuilt addon into target/. `buildNative` always builds; moon decides
  # *whether* to, by hashing src/swift/** and tracking target/ as the output.
  build-native:
    deps:
      - "chords-menu:build-native"
    command: "vp pack"
    inputs:
      - "src/swift/**/*"
      - "package.json"
      - "vite.config.ts"
    outputs:
      - "target"
