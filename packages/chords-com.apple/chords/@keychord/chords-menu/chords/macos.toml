name = "macOS Menu Bar"

[on.menu]
file = "menu.js"
args = []

[chords]
'?-' = { name = "Menu Bar" }
'-0' = { name = "Menu Bar: Apple Logo", 'emit:menu' = ['by-index', '0'] }

'?-1' = { name = "1st menu" }
'?-2' = { name = "2nd menu" }
'?-3' = { name = "3rd menu" }
'?-4' = { name = "4th menu" }
'?-5' = { name = "5th menu" }
'?-6' = { name = "6th menu" }
'?-7' = { name = "7th menu" }
'?-8' = { name = "8th menu" }
'?-9' = { name = "9th menu" }
'-([1-9])' = { name = "Menu Bar: nth item", 'emit:menu' = ["by-index", "$1"] }

'?-(a-z)' = { name = "Menu item by letter" }
'-([a-z]+[0-9]?)' = { name = "Menu Bar: by letter", 'emit:menu' = ["by-letters", "$1"] }
